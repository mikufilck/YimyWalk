# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "codex/bootstrap" ]
  pull_request:
    branches: [ "codex/bootstrap" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Core tests
      run: dotnet test tests/YimyWalk.Core.Tests/YimyWalk.Core.Tests.csproj --configuration Release --no-build --verbosity normal
    - name: Windows adapter tests
      if: runner.os == 'Windows'
      run: dotnet test tests/YimyWalk.App.Tests/YimyWalk.App.Tests.csproj --configuration Release --no-build --verbosity normal
    - name: Compile desktop harnesses (no desktop acceptance)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        foreach ($project in @('DesktopSmoke', 'DesktopInputSmoke', 'DesktopDisplaySmoke', 'ManagerUiSmoke')) {
          dotnet build "tools/$project/$project.csproj" --configuration Release -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
